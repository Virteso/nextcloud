; Override the default TCP listener from www.conf (listen = 9000) so that
; nginx connects over a Unix socket instead.
;
; This file is copied to /usr/local/etc/php-fpm.d/zz-socket.conf so it is
; loaded after www.conf. The socket directory is a volume shared with the
; nginx container.

[www]
listen = /run/php-fpm/php-fpm.sock
listen.owner = www-data
listen.group = www-data
; The nginx worker runs as a different user (and group) than www-data, so the
; socket must be world-readable/writable to allow nginx to connect. The
; directory is only shared between these two containers.
listen.mode = 0666
