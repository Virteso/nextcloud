upstream php-handler {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    # Prevent nginx HTTP requests with Server header
    server_tokens off;

    # Path to the root of your installation
    root /var/www/html;
    client_max_body_size 10G;
    client_body_timeout 3600s;
    fastcgi_buffers 64 4K;

    # Enable gzip but do not remove ETag headers
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    # Pagespeed is not supported by Nextcloud, so if your server is built
    # with the `ngx_pagespeed` module, uncomment this line to disable it.
    #pagespeed off;

    # HTTP response headers borrowed from Nextcloud `.htaccess`
    add_header Referrer-Policy                   "no-referrer"       always;
    add_header X-Content-Type-Options            "nosniff"           always;
    add_header X-Download-Options               "noopen"            always;
    add_header X-Frame-Options                  "SAMEORIGIN"        always;
    add_header X-Permitted-Cross-Domain-Policies "none"              always;
    add_header X-Robots-Tag                     "noindex, nofollow" always;
    add_header X-XSS-Protection                 "1; mode=block"     always;

    # Remove X-Powered-By, which is an information leak
    fastcgi_hide_header X-Powered-By;

    # Specify how to handle directories -- specifying `/index.php$request_uri`
    # here as the fallback means that Nginx needs to know the `HTTP_HOST`
    # from redirected requests (server_name, also provide valid DNS/DHCP names)
    # (see also: https://docs.nextcloud.com/server/latest/admin_manual/issues/index.html#nginx-configuration-notes)
    index index.php index.html /index.php$request_uri;

    # Rule borrowed from `.htaccess` to handle Microsoft DAV clients
    location = / {
        if ( $http_user_agent ~ ^DavClnt ) {
            return 302 /remote.php/webdav/$is_args$args;
        }
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Make a regex exception for `/.well-known` so that clients can have it
    # without authenticating.
    # Note that particular changes may require reloading Nginx due to the
    # regex the following rules are defined.
    location ^~ /.well-known {
        # The rules in this location block needs to be accessed
        # anonymously. No authentication is enabled here. Only the following
        # three | four types are still allowed. HSTS and permissive Cross
        # Site Scripting CSP can be enabled by updating this file.
        allow all;

        # Set the cache expiry days for these paths.
        location ~ ^/\.well-known/(?:carddav|caldav) {
            return 301 $scheme://$host/remote.php/dav;
        }

        location ~ ^/\.well-known/(?:acme-challenge|pki-validation) {
            try_files $uri $uri/ =404;
        }

        # Let Nextcloud's cache (works by ignoring all fastcgi_param rules)
        # ignore all static files to improve performance
        try_files $uri $uri/ =404;
    }

    # Rules borrowed from `.htaccess` to hide certain paths from clients
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  {
        return 404;
    }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        return 404;
    }

    # Ensure this block, which passes PHP files to the PHP process, is
    # above the blocks which handle static assets (as seen below). To
    # associate the correct host or port with server variables, even when
    # there were calls from the Impersonate user,
    # use the `fastcgi_pass` upstream defined in the upstream block above,
    # note that `php-fpm.sock` and `app:9000` in upstream definitions
    # are used as `fastcgi_pass` in all file to be defined later.
    location ~ \.php(?:$|/) {
        # Required for legacy support
        rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_param modHeadersAvailable true;         # Avoid sending the status header e.g. for curl
        fastcgi_param front_controller_active true;     # Enable the performance tuning using headers
        fastcgi_pass php-handler;

        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;

        fastcgi_max_temp_file_size 0;
    }

    # Serve static files
    location ~ \.(?:css|js|mjs|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac)$ {
        try_files $uri /index.php$request_uri;
        # HTTP response headers borrowed from Nextcloud `.htaccess`
        add_header Cache-Control                     "public, max-age=15778463, $asset_immutable";
        add_header Referrer-Policy                   "no-referrer"       always;
        add_header X-Content-Type-Options            "nosniff"           always;
        add_header X-Download-Options               "noopen"            always;
        add_header X-Frame-Options                  "SAMEORIGIN"        always;
        add_header X-Permitted-Cross-Domain-Policies "none"              always;
        add_header X-Robots-Tag                     "noindex, nofollow" always;
        add_header X-XSS-Protection                 "1; mode=block"     always;
        access_log off;
    }

    location ~ \.woff2?$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
    }

    # Rule borrowed from `.htaccess` to properly handle all root files
    location /remote {
        return 301 $scheme://$host/remote.php$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }
}
