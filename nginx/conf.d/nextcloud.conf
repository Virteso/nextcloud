server {
    listen 80;
    server_name 207.127.93.221 207.127.93.221.nip.io 207.127.93.221.sslip.io localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 207.127.93.221 207.127.93.221.nip.io 207.127.93.221.sslip.io localhost;

    ssl_certificate /etc/letsencrypt/live/207.127.93.221.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/207.127.93.221.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10G;

    location / {
        proxy_pass http://app:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
